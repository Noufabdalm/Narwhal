{% extends 'base_content.html' %}
{% block content %}
<div class="container mt-4">
    <h1>Delete Expertise</h1>
    <p>Are you sure you want to delete <strong>{{ expertise.name }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'expertise_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
