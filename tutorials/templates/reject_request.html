{% extends "base_content.html" %}

{% block content %}
<div class="container mt-5">
  <h2 class="mb-4">Reject Request for {{ lesson_request.course.name }} ({{ lesson_request.student.user.full_name }})</h2>
  <form method="post">
    {% csrf_token %}
    <p>Are you sure you want to reject this request?</p>
    <button type="submit" class="btn btn-danger">Reject Request</button>
    <a href="{% url 'manage_lesson_requests' %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
