{% extends 'base_content.html' %}
{% block content %}
<div class="container mt-4">
  <h1>Tutor List</h1>
  <form method="get" class="mb-3">
    <input type="text" name="search" placeholder="Search by name" value="{{ request.GET.search }}" class="form-control mb-2">
    <button type="submit" class="btn btn-primary">Filter</button>
  </form>

  <table class="table table-striped">
    <thead>
      <tr>
        <th></th>
        <th>Name</th>
        <th>Email</th>
        <th>Details</th>
      </tr>
    </thead>
    <tbody>
      {% for tutor in tutors %}
      <tr>
        <td>
          <img src="{{ tutor.user.gravatar }}" alt="Gravatar for {{ tutor.user.full_name }}" class="rounded-circle" width="40" height="40">
        </td>
        <td>{{ tutor.user.full_name }}</td>
        <td>{{ tutor.user.email }}</td>
        <td>
          <a href="{% url 'tutor_detail' tutor_id=tutor.id %}" class="btn btn-secondary btn-sm">View</a>
        </td>
      </tr>
      {% empty %}
      <tr>
        <td colspan="4">No tutors found.</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
