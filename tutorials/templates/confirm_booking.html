{% extends 'base_content.html' %}
{% block content %}
<div class="container mt-5">
    <h2>Confirm Lesson Booking</h2>
    <p><strong>Student:</strong> {{ student_name }}</p>
    <p><strong>Request:</strong> {{ request_details }}</p>
    <p><strong>Session:</strong> {{ session_details }}</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-success">Confirm Booking</button>
        <a href="{% url 'select_session' %}" class="btn btn-secondary">Previous</a>

    </form>
</div>
{% endblock %}
