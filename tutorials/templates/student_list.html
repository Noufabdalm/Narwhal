{% extends 'base_content.html' %}

{% block content %}
<div class="container">
  <h1>Student List</h1>

  <!-- Search and Filter Section -->
  <form method="get" class="mb-3">
    <div class="row">
      <!-- Search Bar -->
      <div class="col-md-6">
        <input type="text" name="search" placeholder="Search by name" value="{{ request.GET.search }}" class="form-control">
      </div>

      <!-- Learning Level Filter -->
      <div class="col-md-4">
        <select name="learning_level" class="form-control">
          <option value="">All Levels</option>
          <option value="beginner" {% if request.GET.learning_level == "beginner" %}selected{% endif %}>Beginner</option>
          <option value="intermediate" {% if request.GET.learning_level == "intermediate" %}selected{% endif %}>Intermediate</option>
          <option value="advanced" {% if request.GET.learning_level == "advanced" %}selected{% endif %}>Advanced</option>
        </select>
      </div>

      <!-- Filter Button -->
      <div class="col-md-2">
        <button type="submit" class="btn btn-primary btn-block">Filter</button>
      </div>
    </div>
  </form>

  <!-- Student Table -->
  <table class="table table-striped">
    <thead>
      <tr>
        <th></th>
        <th>Name</th>
        <th>Email</th>
        <th>Learning Level</th>
        <th>Details</th>
      </tr>
    </thead>
    <tbody>
      {% for student in students %}
      <tr>
        <td class="gravatar-column">
          <img src="{{ student.user.gravatar }}" alt="Gravatar for {{ student.user.full_name }}" class="rounded-circle" width="40" height="40">
        </td>
        <td>{{ student.user.full_name }}</td>
        <td>{{ student.user.email }}</td>
        <td>{{ student.get_learning_level_display }}</td>
        <td>
          <a href="{% url 'student_detail' student_id=student.id %}" class="btn btn-secondary btn-sm">View</a>
        </td>
      </tr>
      {% empty %}
      <tr>
        <td colspan="5">No students found.</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
