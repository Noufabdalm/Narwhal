{% extends "base_content.html" %}

{% block content %}
<div class="container mt-5">
  <h2 class="mb-4">Allocate Tutor for {{ lesson_request.course.name }} ({{ lesson_request.student.user.full_name }})</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Allocate Tutor</button>
  </form>
</div>
{% endblock %}
