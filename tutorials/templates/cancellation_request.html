{% extends 'base_content.html' %}
{% block content %}
<h1>Request Lesson Cancellation</h1>
<form method="post" action="{% url 'request_cancellation' %}">
  {% csrf_token %}
  <div class="form-group">
      {{ form.lesson.label_tag }}
      {{ form.lesson }}
  </div>
  <div class="form-group">
      {{ form.reason.label_tag }}
      {{ form.reason }}
  </div>
  <button type="submit" class="btn btn-primary">Submit</button>
</form>
{% endblock %}
