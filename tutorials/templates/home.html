{% extends 'base.html' %}
{% block body %}

    <h1 class="cover-heading">Code Tutors</h1>
    <p class="cover-text">
      Code Tutors connects learners with tutors for personalized coding lessons to master programming and achieve your goals.
    </p>
    <div class="d-grid gap-3">

      <a href="{% url 'log_in' %}" class="btn btn-lg btn-outline-secondary">Log In</a>
    </div>
  </div>
</div>
{% endblock %}
